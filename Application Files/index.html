<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No network access of any kind: everything is inline, data comes from the pywebview
     bridge (window.pywebview.api), which is not an HTTP connection, and art arrives
     through it as data: URLs. 'unsafe-eval' is required because pywebview delivers API
     return values with eval(); this page never evaluates strings itself. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light dark">
<title>Switch Player</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --tile: #e8e8ed; --text: #1d1d1f; --muted: #6e6e73;
  --faint: #aeaeb2; --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.14);
  --accent: #007aff; --danger: #d70015; --warn: #9a5b00;
  --btn: rgba(0,0,0,.06); --btn-hover: rgba(0,0,0,.11);
  --art-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.08);
  --menu: rgba(246,246,246,.94); --backdrop: rgba(0,0,0,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --card: #2c2c2e; --tile: #3a3a3c; --text: #f5f5f7; --muted: #a1a1a6;
    --faint: #636366; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
    --accent: #0a84ff; --danger: #ff6961; --warn: #ffd60a;
    --btn: rgba(255,255,255,.1); --btn-hover: rgba(255,255,255,.17);
    --art-shadow: 0 0 0 .5px rgba(255,255,255,.1);
    --menu: rgba(44,44,46,.96); --backdrop: rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --card: #2c2c2e; --tile: #3a3a3c; --text: #f5f5f7; --muted: #a1a1a6;
  --faint: #636366; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --danger: #ff6961; --warn: #ffd60a;
  --btn: rgba(255,255,255,.1); --btn-hover: rgba(255,255,255,.17);
  --art-shadow: 0 0 0 .5px rgba(255,255,255,.1);
  --menu: rgba(44,44,46,.96); --backdrop: rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: default; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }

main { height: 100%; overflow-y: auto; padding: 24px 24px 32px; }

/* ── the grid ────────────────────────────────── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 26px 22px;
  max-width: 1240px; margin: 0 auto;
}
.tile { min-width: 0; }
.art {
  display: block; position: relative; width: 100%; aspect-ratio: 1; padding: 0; border: 0;
  border-radius: 12px; overflow: hidden; background: var(--tile); box-shadow: var(--art-shadow);
}
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.art .plain {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 18px; text-align: center; font-size: 17px; font-weight: 600; line-height: 1.25;
  color: var(--muted); overflow-wrap: anywhere;
}
/* Clicking the art plays, so a Game app's art shows a play button under the pointer. */
.art .play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.16); opacity: 0; transition: opacity .12s;
}
.art .play i {
  position: relative; width: 54px; height: 54px; border-radius: 50%;
  background: rgba(255,255,255,.9); box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.art .play i::after {
  content: ""; position: absolute; left: 21px; top: 16px;
  border: solid transparent; border-width: 11px 0 11px 18px; border-left-color: #1d1d1f;
}
.tile.playable .art:hover .play, .tile.playable .art:focus-visible .play { opacity: 1; }
/* A Build's progress, across the bottom of the art: white on a dark track, which shows
   on any art (the accent colour vanished into art that's blue at the bottom). Its width
   eases for no longer than the 1 s between polls, so nothing keeps repainting between them. */
.bar {
  position: absolute; left: 10px; right: 10px; bottom: 10px; height: 6px; border-radius: 3px;
  overflow: hidden; background: rgba(0,0,0,.5); box-shadow: 0 0 0 .5px rgba(255,255,255,.3);
}
.bar > div { height: 100%; width: 0; background: #fff; transition: width .5s linear; }

.meta { padding: 8px 2px 0; }
.line { display: flex; align-items: center; gap: 6px; min-height: 20px; }
/* Up to two lines: a game's own name is often long, and one line cut "The Legend of Zelda:
   Echoes of Wisdom" to the part every Zelda game shares. */
.line.head { align-items: flex-start; }
.name {
  flex: 1; min-width: 0; padding-top: 1px; font-weight: 600; line-height: 1.3; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere;
}
.status { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.building { color: var(--text); }
.status.failed { color: var(--danger); font-weight: 500; }
.more {
  flex: none; width: 24px; height: 20px; margin-right: -3px; padding: 0 0 6px; border: 0;
  border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1;
}
.more:hover, .more[aria-expanded="true"] { background: var(--btn); color: var(--text); }
.act {
  flex: none; border: 0; border-radius: 10px; padding: 1px 10px; font-size: 11px; font-weight: 600;
  background: var(--btn); color: var(--accent);
}
.act.stop { color: var(--text); }
.act:hover { background: var(--btn-hover); }
.act:active { opacity: .7; }
.detail { font-size: 12px; color: var(--muted); }
/* A Build's stage on one line, so the tile doesn't change height as stages go by: a long
   stage name shortens, and its % and time left always show. */
.detail.stage { display: flex; white-space: nowrap; }
.detail.stage span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.detail.stage span + span { flex: none; white-space: pre; }  /* keeps the space before " · 42%" that flex would trim */
.detail:empty { display: none; }
.detail.warn { color: var(--warn); }
.detail .msg {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  color: var(--text); user-select: text; -webkit-user-select: text; cursor: text;
}
.link { border: 0; padding: 0; background: none; color: var(--accent); font-size: 12px; }
.link:hover { text-decoration: underline; }

.empty { max-width: 420px; margin: 18vh auto 0; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { display: block; margin: 16px auto 0; }

/* ── the ⋯ menu ──────────────────────────────── */
.menu {
  position: fixed; z-index: 20; min-width: 210px; padding: 5px; border-radius: 9px;
  background: var(--menu); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: 0 8px 28px rgba(0,0,0,.22), 0 0 0 .5px var(--line-strong);
}
.menu[hidden] { display: none; }
.menu button {
  display: block; width: 100%; padding: 3px 10px; border: 0; border-radius: 5px;
  background: none; text-align: left; white-space: nowrap;
}
.menu button:not(:disabled):hover, .menu button:not(:disabled):focus-visible { background: var(--accent); color: #fff; outline: none; }
.menu button:disabled { color: var(--faint); }
.menu hr { margin: 5px 10px; border: 0; border-top: 1px solid var(--line-strong); }

/* ── Build Options ───────────────────────────── */
dialog {
  width: 440px; max-width: calc(100vw - 32px); padding: 18px 20px 16px; border: 0; border-radius: 12px;
  background: var(--card); color: var(--text);
  box-shadow: 0 20px 50px rgba(0,0,0,.3), 0 0 0 .5px var(--line-strong);
}
dialog::backdrop { background: var(--backdrop); }
dialog h3 { margin: 0 0 6px; font-size: 14px; }
dialog p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
.setup-list { margin: 14px 0; padding: 0; list-style: none; }
.setup-list li { padding: 10px 0; border-top: 1px solid var(--line); }
.setup-list li:first-child { border-top: 0; }
.setup-list b { display: block; font-size: 13px; }
.setup-list span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; user-select: text; -webkit-user-select: text; }
.setup-list .pending { color: var(--warn); }
dialog input {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--bg); color: var(--text); font: 12px ui-monospace, "SF Mono", Menlo, monospace;
  user-select: text; -webkit-user-select: text;
}
dialog input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn { padding: 3px 14px; border: 0; border-radius: 6px; background: var(--btn); }
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <b id="empty-title"></b>
    <span id="empty-description"></span>
    <button class="btn primary" id="choose-library" hidden>Choose Library Folder…</button>
  </div>
</main>

<div class="menu" id="menu" role="menu" hidden></div>

<dialog id="options">
  <h3>Build Options for <span id="options-game"></span></h3>
  <p>Passed to nxnative's build script as typed, at this game's next Build. Leave it empty for nxnative's defaults.</p>
  <input id="options-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="actions"><button class="btn" id="options-cancel">Cancel</button><button class="btn primary" id="options-save">Save</button></div>
</dialog>

<dialog id="setup">
  <h3>Get ready to Build</h3>
  <p>Switch Player checks the tools a Build needs. Xcode and its Metal Toolchain stay manual; Build tools install only when you ask.</p>
  <ul class="setup-list" id="setup-list"></ul>
  <p id="setup-error" hidden></p>
  <div class="actions"><button class="btn" id="setup-close">Not Now</button><button class="btn" id="setup-recheck">Check Again</button><button class="btn primary" id="setup-install" hidden>Install Build Tools</button></div>
</dialog>

<script>
'use strict';

// ── helpers ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
const isNum = v => typeof v === 'number' && isFinite(v);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';

// The once-a-second writes go through put(), which skips a value the element already
// shows: rewriting the same text, markup, class or attribute still makes WebKit restyle,
// lay out and repaint that part of the page. An element written through put() must
// only be written through put(), or its record of what's shown goes stale.
const shown = new WeakMap();
function put(el, prop, value) {
  let last = shown.get(el);
  if (!last) shown.set(el, last = {});
  if (last[prop] === value) return;
  last[prop] = value;
  if (prop === 'text') el.textContent = value;
  else if (prop === 'html') el.innerHTML = value;
  else if (prop === 'class') el.className = value;
  else if (prop === 'hidden') el.hidden = value;
  else if (prop === 'title' || prop.startsWith('aria-')) el.setAttribute(prop, value);
  else el.style.setProperty(prop, value);
}

// nxnative's eta is in seconds, for the stage that's running.
function fmtLeft(secs) {
  if (!isNum(secs)) return '';
  if (secs < 60) return 'under a minute left';
  const mins = Math.round(secs / 60), h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} min left`;
  return m ? `${h} hr ${m} min left` : `${h} hr left`;
}

// ── a game's status ─────────────────────────────────────
// What a tile shows below the name: a one-line status, the button beside it (Build,
// Stop or none), a detail line, and the progress bar's fraction (null hides it).
function statusOf(g) {
  switch (g.state) {
    case 'waiting':
      return { text: 'Waiting', act: 'stop' };
    case 'building': {
      const p = g.progress;
      if (!p) return { text: 'Building', cls: 'building', act: 'stop', bar: 0 };
      if (p.preparing) return { text: 'Preparing Build', cls: 'building', act: 'stop', detail: esc(p.preparing), bar: 0 };
      const pct = isNum(p.frac) ? `${Math.floor(p.frac * 100)}%` : '';
      const nums = [pct, fmtLeft(p.eta)].filter(Boolean).map(s => ` · ${s}`).join('');
      return {
        text: `Building, step ${p.k} of ${p.n}`, cls: 'building', act: 'stop',
        detail: `<span>${esc(cap(p.name))}</span><span>${nums}</span>`, detailCls: 'stage',
        detailTitle: [p.step ? `${cap(p.name)}: ${p.step}` : cap(p.name), nums].join(''),
        bar: Math.min(1, Math.max(0, (p.k - 1 + (isNum(p.frac) ? p.frac : 0)) / p.n)),
      };
    }
    case 'stopped':
      return { text: 'Stopped', act: 'build' };
    case 'failed':
      return {
        text: 'Build failed', cls: 'failed', act: 'build',
        detail: `${g.error ? `<div class="msg">${esc(g.error)}</div>` : ''}<button class="link" data-act="build-log">Show Build Log</button>`,
        detailTitle: g.error || '',
      };
    case 'ready':
      if (g.out_of_date) return { text: 'Ready', act: 'build', detail: 'Your version is out of date, consider rebuilding', detailCls: 'warn' };
      if (g.newer > 0) return { text: 'Ready', detail: `${g.newer.toLocaleString()} newer nxnative change${g.newer === 1 ? '' : 's'}` };
      return { text: 'Ready' };
    case 'nxplay':
      return { text: 'Built in NX Play', act: 'build', detail: "Build once to play it here. It reuses NX Play's files and brings your save." };
    default:
      return { text: 'Not built', act: 'build' };
  }
}

// ── the grid ────────────────────────────────────────────
const main = document.querySelector('main');
const grid = $('grid');
const tiles = new Map();  // game id -> { el, parts…, game, artKey }

function makeTile(g) {
  const el = document.createElement('article');
  el.className = 'tile';
  el.dataset.id = g.id;
  el.innerHTML = `
    <button class="art" data-act="play"><img alt="" hidden><div class="plain"></div><div class="play"><i></i></div><div class="bar" hidden><div></div></div></button>
    <div class="meta">
      <div class="line head"><span class="name"></span><button class="more" data-act="more" aria-label="More" aria-haspopup="menu" aria-expanded="false">⋯</button></div>
      <div class="line"><span class="status"></span><button class="act" data-act="build" hidden></button></div>
      <div class="detail"></div>
    </div>`;
  const q = s => el.querySelector(s);
  return {
    el, art: q('.art'), img: q('img'), plain: q('.plain'), play: q('.play'), bar: q('.bar'), fill: q('.bar > div'),
    name: q('.name'), more: q('.more'), status: q('.status'), act: q('.act'), detail: q('.detail'),
    game: g, artKey: undefined,
  };
}

function updateTile(t, g) {
  t.game = g;
  put(t.el, 'class', g.app ? 'tile playable' : 'tile');
  put(t.name, 'text', g.name);
  put(t.name, 'title', g.name);
  put(t.plain, 'text', g.name);
  put(t.art, 'aria-label', g.app ? `Play ${g.name}` : g.name);
  put(t.art, 'aria-disabled', g.app ? 'false' : 'true');
  put(t.play, 'hidden', !g.app);
  if (g.art !== t.artKey) loadArt(t, g);

  const s = statusOf(g);
  put(t.status, 'class', `status ${s.cls || ''}`);
  put(t.status, 'text', s.text);
  put(t.status, 'title', s.text);
  put(t.act, 'hidden', !s.act);
  if (s.act) {
    put(t.act, 'text', s.act === 'stop' ? 'Stop' : 'Build');
    put(t.act, 'class', `act ${s.act}`);
    t.act.dataset.act = s.act;
  }
  put(t.detail, 'class', `detail ${s.detailCls || ''}`);
  put(t.detail, 'html', s.detail || '');
  put(t.detail, 'title', s.detailTitle || '');
  put(t.bar, 'hidden', s.bar == null);
  if (s.bar != null) put(t.fill, 'width', `${(s.bar * 100).toFixed(1)}%`);
}

// Art comes through its own call, once per change of `art` (a key, not the image), so
// the once-a-second poll doesn't carry it. A game without art is a plain tile with its name.
async function loadArt(t, g) {
  t.artKey = g.art;
  let url = null;
  if (g.art) {
    try { url = await api().art(g.id); } catch (e) { reportError(`art(${g.id}): ${e.message || e}`); }
  }
  if (t.artKey !== g.art) return;  // changed again while this one loaded
  if (url) t.img.src = url; else t.img.removeAttribute('src');
  t.img.hidden = !url;
  t.plain.hidden = !!url;
}

function render(lib) {
  const games = lib.games || [];
  const noFolder = !lib.folder_name;
  put($('empty'), 'hidden', games.length > 0);
  put($('empty-title'), 'text', noFolder ? 'Choose your Library folder' : `No games in ${lib.folder_name}`);
  put($('empty-description'), 'text', noFolder
    ? 'Choose the folder that holds your games. Each game gets a folder of its own, or a single .nup file.'
    : 'Give each game a folder of its own there, with its base game, update and DLC, or put in a single .nup file.');
  put($('choose-library'), 'hidden', !noFolder);
  const seen = new Set();
  games.forEach((g, i) => {
    let t = tiles.get(g.id);
    if (!t) tiles.set(g.id, t = makeTile(g));
    if (grid.children[i] !== t.el) grid.insertBefore(t.el, grid.children[i] || null);
    updateTile(t, g);
    seen.add(g.id);
  });
  for (const [id, t] of tiles) if (!seen.has(id)) { t.el.remove(); tiles.delete(id); }
  if (menuFor && !seen.has(menuFor.game.id)) closeMenu();
}

// ── polling ─────────────────────────────────────────────
// Once a second while the window shows, and straight after anything the player does.
const POLL_MS = 1000;
let pollTimer = null, polling = false, pollAgain = false;
async function poll() {
  clearTimeout(pollTimer);
  if (polling) { pollAgain = true; return; }
  polling = true;
  try { render(await api().library()); } catch (e) { reportError(`library: ${e.message || e}`); }
  polling = false;
  if (pollAgain) { pollAgain = false; return poll(); }
  if (document.visibilityState === 'visible') pollTimer = setTimeout(poll, POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

async function call(name, ...args) {
  try { return await api()[name](...args); }
  catch (e) { reportError(`${name}: ${e.message || e}`); return null; }
  finally { poll(); }
}

// ── what the player does ────────────────────────────────
$('choose-library').addEventListener('click', () => call('choose_library'));
grid.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  const t = b && tiles.get(b.closest('.tile').dataset.id);
  if (!t) return;
  const id = t.game.id;
  switch (b.dataset.act) {
    case 'play': if (t.game.app) call('play', id); break;
    case 'build': call('build', id); break;
    case 'stop': call('stop', id); break;
    case 'build-log': call('show_build_log', id); break;
    case 'more': {
      if (menuFor === t) { closeMenu(); break; }
      const r = b.getBoundingClientRect();
      openMenu(t, r.right, r.bottom + 4, b);
      break;
    }
  }
});
grid.addEventListener('contextmenu', e => {
  const tile = e.target.closest('.tile');
  if (!tile || e.target.closest('.msg')) return;  // the error text keeps its own menu, for Copy
  e.preventDefault();
  openMenu(tiles.get(tile.dataset.id), e.clientX, e.clientY, null, true);
});

// ── the ⋯ menu ──────────────────────────────────────────
const menu = $('menu');
let menuFor = null, menuButton = null;

function menuItems(g) {
  const busy = g.state === 'building' || g.state === 'waiting';
  return [
    ['Settings…', 'open_settings', g.app],
    ['Build Options…', 'options', true],
    null,
    ['Show Log', 'show_log', g.log],
    ['Show in Finder', 'show_in_finder', true],
    null,
    ['Rebuild', 'build', g.app && !busy],
    g.nxplay_save ? ['Import NX Play Save…', 'import_nxplay_save', true] : undefined,
  ].filter(item => item !== undefined);
}

// (x, y) is the menu's top right corner under a ⋯ button, its top left at the pointer.
function openMenu(t, x, y, button, atPointer) {
  closeMenu();
  menuFor = t; menuButton = button;
  menu.innerHTML = menuItems(t.game).map(item => item
    ? `<button role="menuitem" data-cmd="${item[1]}"${item[2] ? '' : ' disabled'}>${esc(item[0])}</button>`
    : '<hr>').join('');
  menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  let left = atPointer ? x : x - w, top = y;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  if (top + h > innerHeight - 8) top = Math.max(8, (button ? button.getBoundingClientRect().top - 4 : y) - h);
  menu.style.left = `${left}px`; menu.style.top = `${top}px`;
  if (button) button.setAttribute('aria-expanded', 'true');
  if (!atPointer) menu.querySelector('button:not(:disabled)')?.focus({ preventScroll: true });
}

function closeMenu() {
  if (!menuFor) return;
  menu.hidden = true;
  if (menuButton) menuButton.setAttribute('aria-expanded', 'false');
  menuFor = menuButton = null;
}

menu.addEventListener('click', e => {
  const b = e.target.closest('button[data-cmd]');
  if (!b || b.disabled) return;
  const t = menuFor;
  closeMenu();
  if (b.dataset.cmd === 'options') editOptions(t);
  else call(b.dataset.cmd, t.game.id);
});
document.addEventListener('mousedown', e => {
  if (menuFor && !menu.contains(e.target) && e.target !== menuButton) closeMenu();
});
document.addEventListener('keydown', e => {
  if (!menuFor) return;
  if (e.key === 'Escape') { const b = menuButton; closeMenu(); b?.focus(); e.preventDefault(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = [...menu.querySelectorAll('button:not(:disabled)')];
  const i = items.indexOf(document.activeElement);
  const next = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length : i) - 1;
  items[next]?.focus();
  e.preventDefault();
});
main.addEventListener('scroll', closeMenu);
window.addEventListener('resize', closeMenu);
window.addEventListener('blur', closeMenu);

// ── Build Options ───────────────────────────────────────
// Until nxnative can list a build's options for a program, they're a text field per
// game, passed to the build script as typed.
let optionsFor = null;
function editOptions(t) {
  optionsFor = t.game.id;
  $('options-game').textContent = t.game.name;
  $('options-input').value = t.game.options || '';
  $('options').showModal();
  $('options-input').focus();
}
async function saveOptions() {
  const id = optionsFor;
  $('options').close();
  await call('set_build_options', id, $('options-input').value.trim());
}
$('options-save').addEventListener('click', saveOptions);
$('options-cancel').addEventListener('click', () => $('options').close());
$('options-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveOptions(); } });

// ── first-launch setup ──────────────────────────────────
let setupSeen = false, setupBusy = false;
async function showSetup(options = {}) {  // options.keepError: a failed install's message stays up
  if (setupBusy) return;
  setupBusy = true;
  if (!options.keepError) $('setup-error').hidden = true;
  $('setup-recheck').disabled = true;
  try {
    const result = await api().setup();
    $('setup-list').innerHTML = (result.items || []).map(item => `
      <li><b>${item.ready ? '✓' : '○'} ${esc(item.name)}</b><span class="${item.ready ? '' : 'pending'}">${esc(item.detail)}</span></li>`).join('');
    $('setup-install').hidden = !(result.items || []).some(item => item.action === 'install');
    $('setup-close').textContent = result.ready ? 'Done' : 'Not Now';
    if (!$('setup').open) $('setup').showModal();
  } catch (e) { reportError(`setup: ${e.message || e}`); }
  setupBusy = false;
  $('setup-recheck').disabled = false;
}
$('setup-close').addEventListener('click', () => $('setup').close());
$('setup-recheck').addEventListener('click', showSetup);
$('setup-install').addEventListener('click', async () => {
  if (setupBusy) return;
  setupBusy = true;
  $('setup-recheck').disabled = true;
  $('setup-install').disabled = true;
  $('setup-install').textContent = 'Installing…';
  const ok = await call('install_tools');
  setupBusy = false;
  $('setup-recheck').disabled = false;
  $('setup-install').disabled = false;
  $('setup-install').textContent = 'Install Build Tools';
  if (!ok) {
    $('setup-error').textContent = 'Homebrew could not install the tools. See the app log, then try again.';
    $('setup-error').hidden = false;
  }
  showSetup({ keepError: !ok });
});

// ── boot ────────────────────────────────────────────────
const reportError = msg => { try { api().log_error(msg); } catch (_) { /* bridge not ready */ } };
window.addEventListener('error', e => reportError(`${e.message} (line ${e.lineno})`));
window.addEventListener('unhandledrejection', e => reportError(`Unhandled: ${e.reason?.message || e.reason}`));

window.addEventListener('pywebviewready', () => {
  poll();
  if (!setupSeen) { setupSeen = true; showSetup(); }
});
</script>
